<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="cache-control" content="no-store" />
    <meta name="theme-color" content="#0e0d1f" />
    <title>Starting PrintBit…</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e0d1f;
        --text: #fff;
        --muted: #c9c9dc;
        --soft: #a6a5b9;
        --primary: #696fc7;
        --lavender: #a7aae1;
        --pink: #f2aebb;
        --warn: #ffd38a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: 'Segoe UI', system-ui, sans-serif;
        user-select: none;
        -webkit-user-select: none;
      }
      body {
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(
            circle at 15% 8%,
            rgba(105, 111, 199, 0.22),
            transparent 34rem
          ),
          radial-gradient(
            circle at 88% 92%,
            rgba(242, 174, 187, 0.12),
            transparent 28rem
          ),
          linear-gradient(145deg, #0e0d1f, #111024 48%, #0d0c1b);
      }
      main {
        width: min(720px, 92vw);
        padding: 48px 40px;
        text-align: center;
        border: 1px solid rgba(167, 170, 225, 0.22);
        border-radius: 28px;
        background: linear-gradient(
          160deg,
          rgba(29, 27, 51, 0.98),
          rgba(18, 17, 34, 0.98)
        );
        box-shadow: 0 28px 80px rgba(0, 0, 0, 0.42);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        color: var(-- lavender);
      }
      .brand svg {
        width: 40px;
        height: 40px;
      }
      .brand span {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.03em;
        color: var(--text);
      }
      .eyebrow {
        margin: 28px 0 10px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.14em;
        color: var(--lavender);
      }
      h1 {
        margin: 0;
        font-size: clamp(32px, 6vw, 52px);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }
      #status {
        margin: 20px auto 0;
        max-width: 46ch;
        font-size: 17px;
        line-height: 1.6;
        color: var(--muted);
        min-height: 56px;
      }
      .track {
        position: relative;
        height: 6px;
        margin: 28px auto 0;
        max-width: 460px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
      }
      .bar {
        position: absolute;
        inset: 0 auto 0 0;
        width: 42%;
        border-radius: inherit;
        background: linear-gradient(
          90deg,
          rgba(105, 111, 199, 0),
          var(--lavender),
          var(-- pink),
          rgba(242, 174, 187, 0)
        );
        transform: translateX(-110%);
        animation: slide 1.7s ease-in-out infinite;
      }
      html[data-state='slow'] #status {
        color: var(--warn);
      }
      @keyframes slide {
        to {
          transform: translateX(270%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar {
          animation: none;
          transform: none;
          width: 68%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand" aria-label="PrintBit">
        <svg viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <rect
            x="7"
            y="4"
            width="18"
            height="11"
            rx="2.5"
            fill="currentColor"
            opacity=".92"
          />
          <rect
            x="4"
            y="12"
            width="24"
            height="14"
            rx="3.5"
            fill="currentColor"
          />
          <rect x="7" y="20" width="18" height="9" rx="2" fill="#fff" />
          <rect
            x="10"
            y="23"
            width="12"
            height="2"
            rx="1"
            fill="currentColor"
            opacity=".55"
          />
        </svg>
        <span>PrintBit</span>
      </div>
      <p class="eyebrow">SELF-SERVICE PRINTING KIOSK</p>
      <h1>Getting PrintBit ready</h1>
      <p id="status" role="status" aria-live="polite">
        Starting kiosk services. This screen will continue automatically.
      </p>
      <div class="track" aria-hidden="true"><span class="bar"></span></div>
    </main>

    <script>
      (function () {
        'use strict';

        var BASE = 'http://127.0.0.1:3000';
        var PROBE_URL = BASE + '/api/startup/ready';
        var TARGET_URL = BASE + '/loading';

        var POLL_MS = 1000;
        var PROBE_TIMEOUT_MS = 3000;
        var SLOW_AFTER_MS = 60000;
        var CONSECUTIVE_OK_REQUIRED = 2;

        var startedAt = Date.now();
        var okStreak = 0;
        var navigating = false;
        var pollInFlight = false;
        var pollTimer = null;
        var statusEl = document.getElementById('status');

        function serverAnswers() {
          var controller = new AbortController();
          var timer = setTimeout(function () {
            controller.abort();
          }, PROBE_TIMEOUT_MS);
          return fetch(PROBE_URL, {
            mode: 'no-cors',
            cache: 'no-store',
            signal: controller.signal,
          })
            .then(
              function () {
                return true;
              },
              function () {
                return false;
              },
            )
            .then(function (ok) {
              clearTimeout(timer);
              return ok;
            });
        }

        function tick() {
          if (navigating || pollInFlight) return;
          pollInFlight = true;
          if (pollTimer !== null) {
            clearTimeout(pollTimer);
            pollTimer = null;
          }

          serverAnswers().then(function (up) {
            pollInFlight = false;
            okStreak = up ? okStreak + 1 : 0;

            if (okStreak >= CONSECUTIVE_OK_REQUIRED) {
              navigating = true;
              statusEl.textContent = 'Kiosk server found. Opening PrintBit…';
              location.replace(TARGET_URL);
              return;
            }

            if (Date.now() - startedAt > SLOW_AFTER_MS) {
              document.documentElement.dataset.state = 'slow';
              statusEl.textContent =
                'Still waiting for the kiosk server. Automatic recovery is running — no action needed.';
            }
            pollTimer = setTimeout(tick, POLL_MS);
          });
        }

        tick();

        document.addEventListener('visibilitychange', function () {
          if (
            document.visibilityState === 'visible' &&
            !navigating &&
            !pollInFlight
          ) {
            tick();
          }
        });
      })();
    </script>
  </body>
</html>
